[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthcheck"
version = "0.1.0"
description = "Fact-checking agent for health/nutrition claims in YouTube videos"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.0",
    "click>=8.1",
    "pydantic>=2.0",
    "requests>=2.31",
    "rich>=13.0",
    "youtube-transcript-api>=1.0",
]

[project.scripts]
truthcheck = "truthcheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["truthcheck*"]
